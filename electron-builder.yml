appId: com.purgewave.app
productName: PurgeWave
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Windows-only build — trims dead weight electron-builder would otherwise bundle from
  # node_modules (it always packs the full production dependency tree regardless of what's
  # listed above, filtered through these same include/exclude patterns):
  #  - sharp's non-win32 platform binaries + libvips, installed alongside the win32 ones so
  #    `npm run dev`/`test` keep working on this Linux devcontainer (see dist/dist:local's
  #    `--os=win32 --cpu=x64` install line) — never loaded on Windows, ~46MB.
  #  - sharp's wasm32 fallback — only relevant if the native win32-x64 binary fails to load,
  #    which isn't a real risk for a plain x64 NSIS target, ~9MB.
  #  - react/react-dom/framer-motion's raw node_modules source — the renderer is a separately
  #    pre-bundled Vite output (out/renderer/assets/*.js) that already inlines all three;
  #    main/preload never import them (both use electron-vite's externalizeDepsPlugin, which
  #    is exactly why sharp/music-metadata/electron-updater DO still need real node_modules
  #    present — they're required at runtime, not bundled), ~18MB.
  # Verified nothing broke: artwork thumbnails (sharp) and swipe-card drag/exit animations
  # (framer-motion) both still work in the packaged --dir build after this change.
  - "!node_modules/@img/sharp-linux-x64/**/*"
  - "!node_modules/@img/sharp-linuxmusl-x64/**/*"
  - "!node_modules/@img/sharp-libvips-linux-x64/**/*"
  - "!node_modules/@img/sharp-libvips-linuxmusl-x64/**/*"
  - "!node_modules/@img/sharp-wasm32/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/framer-motion/**/*"
  - "!node_modules/motion-dom/**/*"
  - "!node_modules/motion-utils/**/*"
  - "!node_modules/scheduler/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Per-user install (%LOCALAPPDATA%, no admin/UAC prompt needed) rather than per-machine
  # (Program Files). electron-updater's background update-install step can't elevate itself, so a
  # per-machine install silently fails to self-update — this is the most likely reason v1.0.1
  # never landed for anyone who picked "install for all users" on the v1.0.0 installer.
  perMachine: false

# electron-updater checks this against GitHub Releases (spec §11: no server needed).
publish:
  provider: github
  owner: BRaiNDED-Digital
  repo: purgewave
